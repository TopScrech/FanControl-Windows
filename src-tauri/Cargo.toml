[package]
name = "fancontrol-windows"
version = "0.1.0"
description = "FanControl for Windows built with Tauri"
authors = ["topscrech"]
edition = "2021"

[lib]
name = "fancontrol_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
rand = { version = "0.9", features = ["std_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time"] }
